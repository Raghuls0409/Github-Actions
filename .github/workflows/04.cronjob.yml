name: CronJob
on:
    schedule:
        - cron: '* * * * *'


jobs:
    cron:
        runs-on: ubuntu-latest

        steps:
        - name: Clone repo
          uses: actions/checkout@v3

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
           python-version: '3.13' 

        - name: Run python Script
          run: Python hello.py