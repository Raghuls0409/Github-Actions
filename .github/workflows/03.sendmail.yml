name: Send Mail
on: push

jobs: 
    mail:
        runs-on: ubuntu-latest

        steps:
        - name: Print Hello world
          run: echo "Hello World"

        - name: Sending a Mail
          if: ${{ always()}}
          uses: dawidd6/action-send-mail@v3
          with:
            sevrer_address: smtp.gmail.com
            server_port: 465

            username: ${{secrets.EMAIL_USERNAME}}
